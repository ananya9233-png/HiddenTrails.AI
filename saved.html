<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My journeys · HiddenTrails.AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    .trip-card { display: flex; flex-direction: column; overflow: hidden; }
    .trip-card .frame { height: 190px; }
    .trip-card .date-badge {
      position: absolute; left: .9rem; top: .9rem; z-index: 2; padding: .45rem .6rem; border-radius: 12px; text-align: center; line-height: 1;
      background: var(--card); box-shadow: var(--shadow-sm); min-width: 52px;
    }
    .trip-card .date-badge b { display: block; font-family: var(--font-display); font-size: 1.35rem; }
    .trip-card .date-badge small { font-size: .65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--clay); }
    .trip-card .del { position: absolute; right: .75rem; top: .75rem; z-index: 2; opacity: 0; transform: scale(.9); transition: all .2s var(--ease);
      background: rgba(255,253,248,.95); }
    .trip-card:hover .del, .trip-card .del:focus-visible { opacity: 1; transform: none; }
    @media (hover: none) { .trip-card .del { opacity: 1; transform: none; } }
    .trip-card.removing { animation: removing .35s var(--ease) forwards; }
    @keyframes removing { to { opacity: 0; transform: scale(.94); } }
  </style>
</head>

<body>
<div class="shell">
  <aside id="sidebar" class="sidebar" aria-label="Main navigation"></aside>

  <div class="min-w-0">
    <header id="mobileBar" class="mobile-bar"></header>

    <main class="main">
      <div class="page-wrap">
        <header class="page-head flex flex-wrap items-end justify-between gap-4">
          <div>
            <span class="eyebrow">Travel journal</span>
            <h1 class="h1">My <span class="italic-accent">journeys</span></h1>
            <p id="countLine">Every trail you've planned, in one place.</p>
          </div>
          <a href="plantrips.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> New trip</a>
        </header>

        <div class="flex flex-col sm:flex-row gap-3 mb-6" id="toolbar" hidden>
          <div class="input-icon flex-1">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="search" class="input" placeholder="Search by destination or vibe…" autocomplete="off" />
          </div>
          <select id="sort" class="input sm:w-56" aria-label="Sort trips">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
            <option value="soon">Upcoming dates</option>
            <option value="budget">Highest budget</option>
          </select>
        </div>

        <div id="tripsContainer" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-5">
          <div class="skeleton h-80"></div><div class="skeleton h-80"></div><div class="skeleton h-80 hidden xl:block"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script type="module">
  import { api, db, requireUser, escapeHtml, FALLBACK_IMAGE } from "./js/app.js";
  import { mountShell, toast, confirmDialog, stagger, smoothImage } from "./js/ui.js";
  import { collection, getDocs, deleteDoc, doc, query, where, updateDoc } from
    "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

  const shell = mountShell("saved.html");
  const container = document.getElementById("tripsContainer");
  const searchInput = document.getElementById("search");
  const sortSelect = document.getElementById("sort");
  let currentUser = null;
  let trips = [];

  const inr = (n) => "₹" + Math.round(Number(n) || 0).toLocaleString("en-IN");

  const EMPTY_STATE = `<div class="empty-state sm:col-span-2 xl:col-span-3">
    <div class="emoji">🧭</div>
    <p class="font-display text-2xl mb-1">No journeys yet</p>
    <p class="muted mb-5">Your first adventure is one form away.</p>
    <a href="plantrips.html" class="btn btn-primary">Plan a trip <i class="fa-solid fa-arrow-right"></i></a>
  </div>`;

  function dateBadge(t) {
    if (!t.arrivalDate) return "";
    const d = new Date(t.arrivalDate + "T00:00:00");
    return `<span class="date-badge"><b>${d.getDate()}</b><small>${d.toLocaleDateString("en-IN", { month: "short" })}</small></span>`;
  }

  function sortedFiltered() {
    const q = searchInput.value.trim().toLowerCase();
    const list = trips.filter((t) => !q || `${t.destination} ${t.preference || ""}`.toLowerCase().includes(q));
    const ts = (t) => t.createdAt?.seconds || 0;
    switch (sortSelect.value) {
      case "old": return list.sort((a, b) => ts(a) - ts(b));
      case "soon": return list.sort((a, b) => (a.arrivalDate || "9999").localeCompare(b.arrivalDate || "9999"));
      case "budget": return list.sort((a, b) => (b.budget || 0) - (a.budget || 0));
      default: return list.sort((a, b) => ts(b) - ts(a));
    }
  }

  function render() {
    if (!trips.length) { container.innerHTML = EMPTY_STATE; return; }
    const list = sortedFiltered();
    if (!list.length) {
      container.innerHTML = `<div class="empty-state sm:col-span-2 xl:col-span-3"><div class="emoji">🔎</div><p class="font-display text-xl">Nothing matches “${escapeHtml(searchInput.value)}”</p></div>`;
      return;
    }

    container.innerHTML = list.map((t) => `
      <article class="card card-hover trip-card relative" data-id="${escapeHtml(t.id)}">
        <a href="itinerary.html?id=${encodeURIComponent(t.id)}" class="block">
          <div class="frame">
            ${dateBadge(t)}
            <img src="${escapeHtml(t.hero_image || FALLBACK_IMAGE)}" alt="${escapeHtml(t.destination)}">
          </div>
        </a>
        <button class="btn btn-danger btn-icon del" data-delete="${escapeHtml(t.id)}" aria-label="Delete ${escapeHtml(t.destination)}" title="Delete trip">
          <i class="fa-regular fa-trash-can"></i>
        </button>
        <a href="itinerary.html?id=${encodeURIComponent(t.id)}" class="p-5 flex-1 flex flex-col">
          <div class="flex items-start justify-between gap-3">
            <h3 class="h3">${escapeHtml(t.destination)}</h3>
            <span class="tag tag-moss flex-none">${escapeHtml(t.preference || "Custom")}</span>
          </div>
          <div class="flex flex-wrap gap-x-4 gap-y-1 text-sm muted mt-2">
            <span><i class="fa-regular fa-calendar mr-1"></i>${t.days?.length || 0} days</span>
            <span><i class="fa-solid fa-wallet mr-1"></i>${inr(t.total_estimated_cost || t.budget)}</span>
          </div>
          <p class="text-sm ink-2 mt-3 line-clamp-2">${escapeHtml(t.days?.[0]?.title ? `Starts with: ${t.days[0].title}` : "")}</p>
          <span class="mt-auto pt-4 font-semibold text-sm" style="color:var(--moss)">Open itinerary <i class="fa-solid fa-arrow-right ml-1"></i></span>
        </a>
      </article>`).join("");

    container.classList.add("stagger");
    stagger(container);
    container.querySelectorAll("img").forEach((img) => smoothImage(img, FALLBACK_IMAGE));
    fillMissingHeroImages(list);
  }

  // Fetch & cache a hero image for trips that don't have one yet
  function fillMissingHeroImages(list) {
    list.filter((t) => !t.hero_image && t.destination && !t._fetching).forEach((t) => {
      t._fetching = true;
      api(`/get-destination-image?query=${encodeURIComponent(t.destination)}`, { auth: false })
        .then((data) => {
          if (!data.image) return;
          t.hero_image = data.image;
          const img = container.querySelector(`[data-id="${CSS.escape(t.id)}"] img`);
          if (img) img.src = data.image;
          return updateDoc(doc(db, "trips", t.id), { hero_image: data.image });
        })
        .catch(() => {});
    });
  }

  container.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-delete]");
    if (!btn) return;
    e.preventDefault();
    const trip = trips.find((t) => t.id === btn.dataset.delete);
    if (!trip) return;

    const ok = await confirmDialog({
      title: `Delete ${trip.destination}?`,
      body: "This removes the itinerary and its photo challenges. It can't be undone.",
      confirmText: "Delete trip",
      danger: true,
      icon: "fa-trash-can",
    });
    if (!ok) return;

    try {
      await deleteDoc(doc(db, "trips", trip.id));
      api(`/photo-challenges/${currentUser.uid}/${encodeURIComponent(trip.destination)}`, { method: "DELETE" })
        .catch((err) => console.warn("Could not delete photo challenges:", err.message));

      const card = btn.closest(".trip-card");
      card.classList.add("removing");
      card.addEventListener("animationend", () => {
        trips = trips.filter((t) => t.id !== trip.id);
        updateCount();
        render();
      }, { once: true });
      toast(`${trip.destination} removed from your journal.`, "success");
    } catch (err) {
      console.error("Delete error:", err);
      toast("Couldn't delete that trip.", "error");
    }
  });

  function updateCount() {
    document.getElementById("countLine").textContent = trips.length
      ? `${trips.length} journey${trips.length > 1 ? "s" : ""} planned so far.`
      : "Every trail you've planned, in one place.";
    document.getElementById("toolbar").hidden = trips.length < 2;
  }

  searchInput.addEventListener("input", render);
  sortSelect.addEventListener("change", render);

  currentUser = await requireUser();
  shell.setUser(currentUser);
  try {
    const snap = await getDocs(query(collection(db, "trips"), where("userId", "==", currentUser.uid)));
    trips = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    updateCount();
    render();
  } catch (err) {
    console.error("Failed to load trips:", err);
    container.innerHTML = `<div class="empty-state sm:col-span-2 xl:col-span-3"><div class="emoji">⚠️</div><p class="font-display text-xl">Couldn't load your journeys.</p><p class="muted">Please refresh and try again.</p></div>`;
  }
</script>
</body>
</html>
