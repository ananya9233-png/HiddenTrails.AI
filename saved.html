<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Saved Journeys | HiddenTrails.AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: #ffffff;
      min-height: 100vh;
    }

    .trip-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: block;
    }
    .trip-card:hover {
      transform: translateY(-6px);
      background: #f1f5f9;
      border-color: #10b981;
      box-shadow: 0 12px 24px rgba(0,0,0,0.08);
    }

    .glass-sidebar {
      background: #f8fafc;
      border-right: 1px solid #e2e8f0;
    }

    .status-badge {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
  </style>
</head>

<body class="font-sans text-gray-800">

<nav class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
  <a href="dashboard.html" class="flex items-center gap-2">
    <i class="fa-solid fa-compass text-green-400 text-2xl"></i>
    <span class="text-xl font-black text-gray-800 tracking-tight">HiddenTrails.AI</span>
  </a>
  <div class="flex items-center space-x-8 font-medium text-gray-600">
    <a href="dashboard.html" class="hover:text-green-500 transition">Home</a>
    <a href="saved.html" class="hover:text-green-500 transition">Saved</a>
    <a href="#" data-logout class="bg-red-500/20 text-red-500 px-5 py-2 rounded-xl border border-red-500/50 hover:bg-red-500 hover:text-white transition">Logout</a>
  </div>
</nav>

<div class="flex min-h-[calc(100vh-72px)]">

  <aside class="w-72 glass-sidebar p-8 space-y-3">
    <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-6">Main Menu</p>
    <a href="dashboard.html" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-gray-100 rounded-2xl transition"><i class="fa-solid fa-house"></i> Dashboard</a>
    <a href="plantrips.html" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-gray-100 rounded-2xl transition"><i class="fa-solid fa-map-location-dot"></i> Plan Trip</a>
    <a href="saved.html" class="flex items-center gap-3 p-4 bg-green-500/20 text-green-600 rounded-2xl font-bold border border-green-500/30"><i class="fa-solid fa-bookmark"></i> Saved Trips</a>
    <a href="photo-challenge.html" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-gray-100 rounded-2xl transition"><i class="fa-solid fa-camera-retro"></i> Photo Challenge</a>
    <a href="rewards.html" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-gray-100 rounded-2xl transition"><i class="fa-solid fa-gift"></i> Rewards</a>
    <a href="upload-gem.html" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-gray-100 rounded-2xl transition"><i class="fa-solid fa-gem"></i> Upload Gem</a>
  </aside>

  <main class="flex-1 p-12 overflow-y-auto">
    <div class="max-w-6xl mx-auto">
      <header class="mb-12 flex items-center justify-between">
        <div>
          <h2 class="text-3xl font-black tracking-tight text-gray-800">Saved Journeys 🔖</h2>
          <p class="text-gray-500 mt-2 text-sm">Pick up where you left off on your hidden adventures.</p>
        </div>
        <a href="plantrips.html" class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-xl font-bold transition-all transform hover:scale-105">
          <i class="fa-solid fa-plus mr-2"></i> New Trip
        </a>
      </header>

      <div id="tripsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="col-span-full text-center p-20">
          <i class="fa-solid fa-spinner fa-spin text-4xl text-green-400 mb-4"></i>
          <p class="text-gray-400">Loading your saved trips...</p>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { api, db, requireUser, wireLogout, escapeHtml, FALLBACK_IMAGE } from "./js/app.js";
  import { collection, getDocs, deleteDoc, doc, orderBy, query, where, updateDoc } from
    "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

  wireLogout();

  const container = document.getElementById("tripsContainer");
  const trips = new Map(); // tripId -> trip data
  let currentUser = null;

  const EMPTY_STATE = `<div class="col-span-full text-center p-20 bg-gray-50 rounded-3xl border border-dashed border-gray-300">
    <div class="text-6xl mb-4">🧭</div>
    <p class="text-gray-400 text-lg mb-4">No trips saved yet. Time to plan one!</p>
    <a href="plantrips.html" class="inline-block bg-green-500 hover:bg-green-600 text-white px-8 py-3 rounded-xl font-bold transition">Plan a Trip <i class="fa-solid fa-arrow-right ml-2"></i></a>
  </div>`;

  // Delete a trip and its photo challenges
  async function deleteTrip(tripId, card) {
    if (!confirm("Delete this trip? This will also remove associated photo challenges.")) return;
    const trip = trips.get(tripId);
    try {
      await deleteDoc(doc(db, "trips", tripId));

      if (trip?.destination) {
        try {
          await api(`/photo-challenges/${currentUser.uid}/${encodeURIComponent(trip.destination)}`, { method: "DELETE" });
        } catch (chalErr) {
          console.warn("⚠️ Could not delete photo challenges:", chalErr.message);
        }
      }

      trips.delete(tripId);
      card.remove();
      if (container.children.length === 0) container.innerHTML = EMPTY_STATE;
    } catch (err) {
      console.error("Delete error:", err);
      alert("Failed to delete trip.");
    }
  }

  async function loadTrips(uid) {
    let snapshot;
    try {
      // User-scoped query with ordering (requires a composite index)
      snapshot = await getDocs(query(collection(db, "trips"), where("userId", "==", uid), orderBy("createdAt", "desc")));
    } catch (err) {
      console.warn("Composite index not ready, using simple query...", err.message);
      try {
        snapshot = await getDocs(query(collection(db, "trips"), where("userId", "==", uid)));
      } catch (err2) {
        console.error("Failed to load trips:", err2);
        container.innerHTML = `<p class="text-center text-red-400 p-10">Failed to load trips. Please try again.</p>`;
        return;
      }
    }
    renderTrips(snapshot);
  }

  function renderTrips(snapshot) {
    if (snapshot.empty) {
      container.innerHTML = EMPTY_STATE;
      return;
    }

    container.innerHTML = "";
    snapshot.forEach((docSnap) => {
      const t = docSnap.data();
      trips.set(docSnap.id, t);

      const card = document.createElement("div");
      card.className = "trip-card group";
      card.innerHTML = `
        <a href="itinerary.html?id=${encodeURIComponent(docSnap.id)}" class="block">
          <div class="relative h-52 overflow-hidden bg-gray-200">
            <img src="${escapeHtml(t.hero_image || "")}" alt="${escapeHtml(t.destination)}"
                 class="w-full h-full object-cover transition duration-500 group-hover:scale-110">
            <div class="absolute top-4 right-4 status-badge px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider">
              ${escapeHtml(t.preference || "Custom")}
            </div>
          </div>

          <div class="p-6">
            <h3 class="text-xl font-bold mb-2 group-hover:text-green-500 transition">${escapeHtml(t.destination)}</h3>

            <div class="flex items-center gap-4 text-xs text-gray-400 mb-4 font-medium">
              <span><i class="fa-solid fa-calendar-day mr-1 text-green-400"></i> ${t.days?.length || 0} Days</span>
              <span><i class="fa-solid fa-wallet mr-1 text-green-400"></i> ₹${escapeHtml(t.total_estimated_cost || t.budget || "-")}</span>
            </div>

            ${t.arrivalDate ? `<p class="text-xs text-gray-500 mb-4"><i class="fa-solid fa-plane-departure mr-1"></i> ${escapeHtml(t.arrivalDate)} → ${escapeHtml(t.returnDate)}</p>` : ""}

            <div class="w-full text-center py-3 rounded-xl bg-green-500 group-hover:bg-green-600 text-white text-sm font-bold transition">
              View Itinerary <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>
            </div>
          </div>
        </a>

        <div class="px-6 pb-4">
          <button type="button" class="delete-btn w-full text-center py-2 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-500 text-xs font-bold transition border border-red-500/20">
            <i class="fa-solid fa-trash mr-1"></i> Delete Trip
          </button>
        </div>
      `;

      card.querySelector(".delete-btn").addEventListener("click", () => deleteTrip(docSnap.id, card));
      const img = card.querySelector("img");
      img.addEventListener("error", () => { img.src = FALLBACK_IMAGE; }, { once: true });
      container.appendChild(card);

      // No cached hero image yet → fetch one and save it for next time
      if (!t.hero_image && t.destination) {
        api(`/get-destination-image?query=${encodeURIComponent(t.destination)}`, { auth: false })
          .then((data) => {
            img.src = data.image || FALLBACK_IMAGE;
            if (data.image) return updateDoc(doc(db, "trips", docSnap.id), { hero_image: data.image });
          })
          .catch(() => { img.src = FALLBACK_IMAGE; });
      }
    });
  }

  currentUser = await requireUser();
  await loadTrips(currentUser.uid);
</script>

</body>
</html>
