<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Itinerary | HiddenTrails.AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: #ffffff;
      min-height: 100vh;
    }

    .glass-sidebar {
      background: #f8fafc;
      border-right: 1px solid #e2e8f0;
    }

    .glass-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      overflow: hidden;
      transition: all 0.4s ease;
    }
    .glass-card:hover {
      background: #f1f5f9;
      border-color: rgba(16, 185, 129, 0.3);
      transform: translateY(-4px);
    }

    .hero-overlay {
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.1));
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
  </style>
</head>

<body class="font-sans text-gray-800">

<nav class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
  <a href="dashboard.html" class="flex items-center gap-2">
    <i class="fa-solid fa-compass text-green-400 text-2xl"></i>
    <span class="text-xl font-black text-gray-800 tracking-tight">HiddenTrails.AI</span>
  </a>
  <div class="flex items-center space-x-8 font-medium text-gray-600">
    <a href="dashboard.html" class="hover:text-green-500 transition">Home</a>
    <a href="saved.html" class="hover:text-green-500 transition">Saved</a>
    <a href="#" data-logout class="bg-red-500/20 text-red-500 px-5 py-2 rounded-xl border border-red-500/50 hover:bg-red-500 hover:text-white transition">Logout</a>
  </div>
</nav>

<div class="flex min-h-[calc(100vh-72px)]">

  <aside class="w-72 glass-sidebar p-8 space-y-3">
    <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-6">Main Menu</p>
    <a href="dashboard.html" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-gray-100 rounded-2xl transition"><i class="fa-solid fa-house"></i> Dashboard</a>
    <a href="plantrips.html" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-gray-100 rounded-2xl transition"><i class="fa-solid fa-map-location-dot"></i> Plan Trip</a>
    <a href="saved.html" class="flex items-center gap-3 p-4 bg-green-500/20 text-green-600 rounded-2xl font-bold border border-green-500/30"><i class="fa-solid fa-bookmark"></i> Saved Trips</a>
    <a href="photo-challenge.html" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-gray-100 rounded-2xl transition"><i class="fa-solid fa-camera-retro"></i> Photo Challenge</a>
    <a href="rewards.html" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-gray-100 rounded-2xl transition"><i class="fa-solid fa-gift"></i> Rewards</a>
    <a href="upload-gem.html" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-gray-100 rounded-2xl transition"><i class="fa-solid fa-gem"></i> Upload Gem</a>
  </aside>

  <main class="flex-1 p-12 overflow-y-auto">
    <div class="max-w-4xl mx-auto space-y-8">

      <!-- Hero Section -->
      <div id="heroSection" class="relative h-80 rounded-3xl overflow-hidden glass-card">
        <img id="heroImage" class="w-full h-full object-cover" alt="Destination">
        <div class="absolute inset-0 hero-overlay flex flex-col justify-end p-10">
          <h1 id="tripTitle" class="text-4xl font-black mb-2 text-white"></h1>
          <p id="budgetInfo" class="text-gray-300 font-medium"></p>
        </div>
      </div>

      

      <!-- Days Container -->
      <div id="daysContainer" class="space-y-8">
        <div class="text-center p-20">
          <i class="fa-solid fa-spinner fa-spin text-4xl text-green-400 mb-4"></i>
          <p class="text-gray-400">Loading your itinerary...</p>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex justify-center gap-4 mt-8">
        <button id="regenBtn"
          class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-white px-8 py-4 rounded-2xl font-bold text-lg transition-all transform hover:scale-105 shadow-lg shadow-amber-900/30">
          <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Regenerate AI
        </button>

        <a href="saved.html"
           class="bg-gray-100 hover:bg-gray-200 border border-gray-200 text-gray-700 px-8 py-4 rounded-2xl font-bold text-lg transition-all transform hover:scale-105">
          <i class="fa-solid fa-bookmark mr-2"></i> Saved Trips
        </a>
      </div>

    </div>
  </main>

</div>

<script type="module">
import { api, db, requireUser, wireLogout, escapeHtml, FALLBACK_IMAGE } from "./js/app.js";
import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

wireLogout();

const id = new URLSearchParams(window.location.search).get("id");

const heroImage = document.getElementById("heroImage");
const tripTitle = document.getElementById("tripTitle");
const budgetInfo = document.getElementById("budgetInfo");
const daysContainer = document.getElementById("daysContainer");
const regenBtn = document.getElementById("regenBtn");

heroImage.addEventListener("error", () => { heroImage.src = FALLBACK_IMAGE; }, { once: true });

let trip;

const LANDMARK_SUFFIXES = "Darwaza|Imambara|Imambada|Beach|Fort|Palace|Temple|Church|Museum|Market|Lake|Falls|Waterfall|Point|Park|Garden|Gate|Mahal|Mosque|Masjid|Bridge|Island|Cave|Tower|Bay|Dam|Hill|Mountain|Square|Bazaar|Mandir|Gurudwara|Dargah|Memorial|Zoo|Sanctuary|Reserve|Valley|Harbour|Harbor|Basilica|Cathedral|Monastery|Ruins|Tomb|Stupa|Canyon|Gorge|Forest|Plateau|Lighthouse|Station|Complex|Ashram|Chowk|Residency|Ghat|Stepwell|Haveli|Kothi|Bhawan|Bhavan|Maqbara|Bagh|Kund|Nagar|Sagar|Kila|Qila|Jheel|Minar|Burj|Pol|Sabha|Baoli|Tekri";
const NOT_A_LANDMARK = /cafe|restaurant|hotel|dhaba|eatery|bistro|bar|lounge|factory/i;

/** Best-effort guess of the main landmark mentioned in a day's plan. */
function extractLandmark(day) {
  const dayText = `${day.morning || ""} ${day.afternoon || ""} ${day.evening || ""}`;
  const patterns = [
    new RegExp(`(?:visit|explore|head to|go to|reach|arrive at|check out|see|tour)\\s+(?:the\\s+)?(?:iconic\\s+|famous\\s+|renowned\\s+|historic\\s+|popular\\s+|beautiful\\s+|ancient\\s+|magnificent\\s+|stunning\\s+)?([A-Z][A-Za-z\\s'-]+(?:${LANDMARK_SUFFIXES}))`, "i"),
    /(?:visit|explore|head to)\s+(?:the\s+)?(?:iconic\s+|famous\s+|historic\s+)?([A-Z][A-Za-z\s'-]{3,30}(?=[.,!;]))/i,
  ];
  for (const pattern of patterns) {
    const match = dayText.match(pattern);
    if (match?.[1]) {
      const name = match[1].trim().replace(/\s+/g, " ");
      if (!NOT_A_LANDMARK.test(name)) return name;
    }
  }
  const properNouns = dayText.match(/[A-Z][a-z]+(?:\s+[A-Z][a-z]+)+/g) || [];
  for (const noun of properNouns) {
    if (!/Cafe|Restaurant|Hotel|Dhaba|Factory|Start|Then|Try|Have|Enjoy|Take|Visit|Head|Entry|Egg|Morning|Afternoon|Evening/i.test(noun)) {
      return noun;
    }
  }
  return null;
}

async function getDestinationImage(query) {
  try {
    const data = await api(`/get-destination-image?query=${encodeURIComponent(query)}`, { auth: false });
    return data.image || null;
  } catch (err) {
    console.warn("Image fetch failed:", err.message);
    return null;
  }
}

function renderDay(day, imageUrl) {
  const landmark = extractLandmark(day);
  const mapQuery = landmark ? `${landmark}, ${trip.destination}` : `${day.title || ""}, ${trip.destination}`;
  const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(mapQuery)}`;
  const evening = day.evening && day.evening !== "N/A" ? day.evening : "Wrap up the day with a relaxed local dinner nearby.";

  const card = document.createElement("div");
  card.className = "glass-card p-8";
  card.innerHTML = `
    <h2 class="text-2xl font-black mb-4 text-gray-800">
      <span class="text-green-500">Day ${escapeHtml(day.day)}:</span> ${escapeHtml(day.title)}
    </h2>

    <img src="${escapeHtml(imageUrl || FALLBACK_IMAGE)}" alt="${escapeHtml(landmark || trip.destination)}"
         class="rounded-2xl mb-6 w-full h-72 object-cover border border-gray-200">

    <div class="space-y-5 text-gray-600 leading-relaxed">
      <div class="flex gap-4">
        <div class="w-1 bg-amber-500 rounded-full flex-shrink-0"></div>
        <div>
          <span class="text-[10px] uppercase tracking-widest text-amber-500 font-bold">Morning</span>
          <p class="mt-1">${escapeHtml(day.morning)}</p>
        </div>
      </div>
      <div class="flex gap-4">
        <div class="w-1 bg-blue-500 rounded-full flex-shrink-0"></div>
        <div>
          <span class="text-[10px] uppercase tracking-widest text-blue-500 font-bold">Afternoon</span>
          <p class="mt-1">${escapeHtml(day.afternoon)}</p>
        </div>
      </div>
      <div class="flex gap-4">
        <div class="w-1 bg-purple-500 rounded-full flex-shrink-0"></div>
        <div>
          <span class="text-[10px] uppercase tracking-widest text-purple-500 font-bold">Evening</span>
          <p class="mt-1">${escapeHtml(evening)}</p>
        </div>
      </div>
    </div>

    <div class="mt-6 pt-4 border-t border-gray-200 flex items-center justify-between">
      <span class="text-green-500 font-black text-lg">₹${escapeHtml(day.estimated_cost)}</span>
      <div class="flex items-center gap-3">
        <span class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Estimated Cost</span>
        <a href="${escapeHtml(mapsUrl)}" target="_blank" rel="noopener"
           class="inline-flex items-center gap-1.5 px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold rounded-xl transition shadow-sm">
          <i class="fa-solid fa-location-dot"></i> Open in Maps
        </a>
      </div>
    </div>
  `;
  const img = card.querySelector("img");
  img.addEventListener("error", () => { img.src = FALLBACK_IMAGE; }, { once: true });
  return card;
}

async function loadTrip() {
  try {
    if (!id) {
      daysContainer.innerHTML = `<p class="text-center text-red-400 p-10">No trip ID provided.</p>`;
      return;
    }

    const snap = await getDoc(doc(db, "trips", id));
    if (!snap.exists()) {
      daysContainer.innerHTML = `<p class="text-center text-red-400 p-10">Trip not found.</p>`;
      return;
    }

    trip = snap.data();
    const days = Array.isArray(trip.days) ? trip.days : [];
    const updates = {};

    // Hero image (cached on the trip so Saved Trips can reuse it)
    if (!trip.hero_image) {
      const hero = await getDestinationImage(trip.destination);
      if (hero) { trip.hero_image = hero; updates.hero_image = hero; }
    }
    heroImage.src = trip.hero_image || FALLBACK_IMAGE;

    const style = trip.trip_style ?? trip.preference ?? "Custom";
    tripTitle.textContent = `${trip.destination} – ${days.length} Day ${style} Trip`;
    budgetInfo.textContent = `Budget: ₹${trip.budget} | Estimated: ₹${trip.total_estimated_cost}`;

    if (days.length === 0) {
      daysContainer.innerHTML = `<p class="text-center text-gray-400 p-10">This trip has no days yet — try Regenerate.</p>`;
      return;
    }

    // Fetch missing day images in parallel; reuse ones already cached on the trip
    let imagesChanged = false;
    const images = await Promise.all(days.map(async (day) => {
      if (day.image) return day.image;
      const landmark = extractLandmark(day);
      const query = landmark
        ? `${landmark} ${trip.destination}`
        : `${trip.destination} ${(day.title || "").replace(/Arrival|Beach|Vibes|&/gi, "").trim() || "landmark"}`;
      const url = await getDestinationImage(query);
      if (url) { day.image = url; imagesChanged = true; }
      return url;
    }));

    daysContainer.innerHTML = "";
    days.forEach((day, i) => daysContainer.appendChild(renderDay(day, images[i])));

    if (imagesChanged) updates.days = days;
    if (Object.keys(updates).length) {
      updateDoc(doc(db, "trips", id), updates).catch((e) => console.warn("Could not cache images:", e.message));
    }
  } catch (err) {
    console.error("LoadTrip Error:", err);
    daysContainer.innerHTML = `<p class="text-center text-red-400 p-10">Something went wrong loading this trip.</p>`;
  }
}

await requireUser();
loadTrip();

// Regenerate Button
regenBtn.addEventListener("click", async () => {
  if (!trip) return;
  if (!confirm("Regenerate itinerary? This will replace the current one.")) return;

  regenBtn.disabled = true;
  regenBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Regenerating...`;

  try {
    await api("/regenerate-itinerary", { method: "POST", body: { tripId: id } });
    location.reload();
  } catch (err) {
    console.error("Regenerate error:", err);
    alert(err.status ? err.message : "Failed to regenerate. Check if backend is running.");
    regenBtn.disabled = false;
    regenBtn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Regenerate AI`;
  }
});
</script>

</body>
</html>
