<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your itinerary · HiddenTrails.AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    .hero { position: relative; height: clamp(280px, 42vw, 420px); border-radius: var(--radius-lg); overflow: hidden; background: var(--ink); }
    .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); transition: transform 8s linear, opacity .6s; }
    .hero:hover img { transform: scale(1.1); }
    .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(20,28,25,.88) 0%, rgba(20,28,25,.35) 45%, rgba(20,28,25,.05) 100%); }
    .hero-content { position: absolute; inset: auto 0 0 0; z-index: 2; padding: clamp(1.25rem, 3vw, 2.5rem); color: #fff; }
    .hero .tag { background: rgba(255,255,255,.16); color: #fff; backdrop-filter: blur(4px); }

    .day-nav { position: sticky; top: 0; z-index: 20; padding: .75rem 0; background: linear-gradient(var(--paper) 75%, transparent); }
    @media (max-width: 1023px) { .day-nav { top: 62px; } }
    .day-nav .chip { flex: none; }

    .day-card .frame { height: 240px; }
    .day-card .slot-text { color: var(--ink-2); }
    .budget-meter { height: 14px; border-radius: 99px; background: var(--paper-2); overflow: hidden; position: relative; }
    .budget-meter span { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; transition: width 1.2s var(--ease); background: linear-gradient(90deg, var(--moss-2), var(--moss)); }
  </style>
</head>

<body>
<div class="shell">
  <aside id="sidebar" class="sidebar" aria-label="Main navigation"></aside>

  <div class="min-w-0">
    <header id="mobileBar" class="mobile-bar"></header>

    <main class="main">
      <div class="container-narrow">

        <a href="saved.html" class="btn btn-ghost btn-sm mb-4 -ml-2"><i class="fa-solid fa-arrow-left"></i> My journeys</a>

        <!-- Hero -->
        <section id="heroSection" class="hero mb-6">
          <img id="heroImage" alt="" />
          <div class="hero-content">
            <div class="flex flex-wrap gap-2 mb-3" id="heroTags"></div>
            <h1 id="tripTitle" class="font-display text-3xl md:text-5xl font-semibold leading-tight" style="color:#fff">Loading your trail…</h1>
            <p id="budgetInfo" class="mt-2 text-sm md:text-base" style="color:rgba(255,255,255,.8)"></p>
          </div>
        </section>

        <!-- Budget + actions -->
        <section class="card card-pad mb-6 reveal" id="budgetCard" hidden>
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div class="flex-1 min-w-[220px]">
              <div class="flex justify-between text-sm mb-2">
                <span class="font-semibold">Estimated spend</span>
                <span><b id="estAmount">₹0</b> <span class="muted">of <span id="budgetAmount">₹0</span></span></span>
              </div>
              <div class="budget-meter"><span id="budgetBar"></span></div>
              <p class="text-xs muted mt-2" id="budgetNote"></p>
            </div>
            <div class="flex gap-2 flex-wrap">
              <a href="photo-challenge.html" class="btn"><i class="fa-solid fa-camera-retro" style="color:var(--clay)"></i> Challenges</a>
              <button id="regenBtn" class="btn btn-clay"><i class="fa-solid fa-rotate"></i> Regenerate</button>
            </div>
          </div>
        </section>

        <!-- Day navigator -->
        <nav class="day-nav" id="dayNavWrap" hidden>
          <div class="flex gap-2 overflow-x-auto pb-1" id="dayNav"></div>
        </nav>

        <!-- Days -->
        <div id="daysContainer" class="trail mt-4">
          <div class="skeleton h-96 mb-6"></div>
          <div class="skeleton h-96"></div>
        </div>

      </div>
    </main>
  </div>
</div>

<script type="module">
import { api, db, requireUser, escapeHtml, FALLBACK_IMAGE } from "./js/app.js";
import { mountShell, toast, confirmDialog, confetti, revealOnScroll, smoothImage, busy } from "./js/ui.js";
import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const shell = mountShell("saved.html");
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const $ = (x) => document.getElementById(x);
const heroImage = $("heroImage");
const daysContainer = $("daysContainer");
const regenBtn = $("regenBtn");
const inr = (n) => "₹" + Math.round(Number(n) || 0).toLocaleString("en-IN");

smoothImage(heroImage, FALLBACK_IMAGE);

let trip;

const LANDMARK_SUFFIXES = "Darwaza|Imambara|Imambada|Beach|Fort|Palace|Temple|Church|Museum|Market|Lake|Falls|Waterfall|Point|Park|Garden|Gate|Mahal|Mosque|Masjid|Bridge|Island|Cave|Tower|Bay|Dam|Hill|Mountain|Square|Bazaar|Mandir|Gurudwara|Dargah|Memorial|Zoo|Sanctuary|Reserve|Valley|Harbour|Harbor|Basilica|Cathedral|Monastery|Ruins|Tomb|Stupa|Canyon|Gorge|Forest|Plateau|Lighthouse|Station|Complex|Ashram|Chowk|Residency|Ghat|Stepwell|Haveli|Kothi|Bhawan|Bhavan|Maqbara|Bagh|Kund|Nagar|Sagar|Kila|Qila|Jheel|Minar|Burj|Pol|Sabha|Baoli|Tekri";
const NOT_A_LANDMARK = /cafe|restaurant|hotel|dhaba|eatery|bistro|bar|lounge|factory/i;

/** Best-effort guess of the main landmark mentioned in a day's plan. */
function extractLandmark(day) {
  const dayText = `${day.morning || ""} ${day.afternoon || ""} ${day.evening || ""}`;
  const patterns = [
    new RegExp(`(?:visit|explore|head to|go to|reach|arrive at|check out|see|tour)\\s+(?:the\\s+)?(?:iconic\\s+|famous\\s+|renowned\\s+|historic\\s+|popular\\s+|beautiful\\s+|ancient\\s+|magnificent\\s+|stunning\\s+)?([A-Z][A-Za-z\\s'-]+(?:${LANDMARK_SUFFIXES}))`, "i"),
    /(?:visit|explore|head to)\s+(?:the\s+)?(?:iconic\s+|famous\s+|historic\s+)?([A-Z][A-Za-z\s'-]{3,30}(?=[.,!;]))/i,
  ];
  for (const pattern of patterns) {
    const match = dayText.match(pattern);
    if (match?.[1]) {
      const name = match[1].trim().replace(/\s+/g, " ");
      if (!NOT_A_LANDMARK.test(name)) return name;
    }
  }
  const properNouns = dayText.match(/[A-Z][a-z]+(?:\s+[A-Z][a-z]+)+/g) || [];
  for (const noun of properNouns) {
    if (!/Cafe|Restaurant|Hotel|Dhaba|Factory|Start|Then|Try|Have|Enjoy|Take|Visit|Head|Entry|Egg|Morning|Afternoon|Evening/i.test(noun)) {
      return noun;
    }
  }
  return null;
}

async function getDestinationImage(query) {
  try {
    const data = await api(`/get-destination-image?query=${encodeURIComponent(query)}`, { auth: false });
    return data.image || null;
  } catch (err) {
    console.warn("Image fetch failed:", err.message);
    return null;
  }
}

const SLOTS = [
  { key: "morning",   label: "Morning",   icon: "fa-sun",       color: "#b07a12" },
  { key: "afternoon", label: "Afternoon", icon: "fa-cloud-sun", color: "var(--sky)" },
  { key: "evening",   label: "Evening",   icon: "fa-moon",      color: "var(--plum)" },
];

function renderDay(day, imageUrl) {
  const landmark = extractLandmark(day);
  const mapQuery = landmark ? `${landmark}, ${trip.destination}` : `${day.title || ""}, ${trip.destination}`;
  const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(mapQuery)}`;
  if (!day.evening || day.evening === "N/A") day.evening = "Wrap up the day with a relaxed local dinner nearby.";

  const stop = document.createElement("article");
  stop.className = "trail-stop reveal";
  stop.id = `day-${day.day}`;
  stop.innerHTML = `
    <span class="trail-marker">${escapeHtml(day.day)}</span>
    <div class="card day-card overflow-hidden card-hover">
      <div class="frame">
        <img src="${escapeHtml(imageUrl || FALLBACK_IMAGE)}" alt="${escapeHtml(landmark || trip.destination)}">
        ${landmark ? `<span class="tag absolute left-3 bottom-3" style="background:rgba(255,253,248,.92)"><i class="fa-solid fa-location-dot" style="color:var(--clay)"></i>${escapeHtml(landmark)}</span>` : ""}
      </div>
      <div class="p-5 md:p-6">
        <p class="eyebrow">Day ${escapeHtml(day.day)}</p>
        <h2 class="h2 mt-1 mb-3">${escapeHtml(day.title)}</h2>
        ${SLOTS.map((s) => `
          <div class="slot">
            <span class="slot-time" style="color:${s.color}"><i class="fa-solid ${s.icon}"></i>${s.label}</span>
            <p class="slot-text m-0">${escapeHtml(day[s.key])}</p>
          </div>`).join("")}
        <hr class="dotted-divider">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <p class="m-0"><span class="muted text-sm">Est. for the day</span> <b class="font-display text-xl ml-1" style="color:var(--moss)">${inr(day.estimated_cost)}</b></p>
          <a href="${escapeHtml(mapsUrl)}" target="_blank" rel="noopener" class="btn btn-sm"><i class="fa-solid fa-map-location-dot" style="color:var(--sky)"></i> Directions</a>
        </div>
      </div>
    </div>`;
  smoothImage(stop.querySelector("img"), FALLBACK_IMAGE);
  return stop;
}

function renderBudget(days) {
  const est = Number(trip.total_estimated_cost) || days.reduce((s, d) => s + (Number(d.estimated_cost) || 0), 0);
  const budget = Number(trip.budget) || 0;
  const pct = budget ? Math.min(100, (est / budget) * 100) : 0;
  $("estAmount").textContent = inr(est);
  $("budgetAmount").textContent = inr(budget);
  $("budgetNote").textContent = budget >= est
    ? `About ${inr(budget - est)} left for souvenirs and surprises.`
    : `Plan runs ${inr(est - budget)} over budget — try regenerating.`;
  $("budgetCard").hidden = false;
  setTimeout(() => { $("budgetBar").style.width = pct + "%"; }, 50);
}

function renderDayNav(days) {
  const nav = $("dayNav");
  nav.innerHTML = days.map((d) => `<a href="#day-${d.day}" class="chip">Day ${escapeHtml(d.day)}</a>`).join("");
  $("dayNavWrap").hidden = false;

  // Highlight the day currently on screen
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      if (!en.isIntersecting) return;
      nav.querySelectorAll(".chip").forEach((c) => c.classList.toggle("is-active", c.getAttribute("href") === `#${en.target.id}`));
    });
  }, { rootMargin: "-40% 0px -55% 0px" });
  document.querySelectorAll(".trail-stop").forEach((s) => io.observe(s));
}

async function loadTrip() {
  try {
    if (!id) {
      daysContainer.innerHTML = `<div class="empty-state"><div class="emoji">🗺️</div><p class="font-display text-xl">No trip selected.</p></div>`;
      return;
    }

    const snap = await getDoc(doc(db, "trips", id));
    if (!snap.exists()) {
      daysContainer.innerHTML = `<div class="empty-state"><div class="emoji">🔍</div><p class="font-display text-xl">Trip not found.</p><a href="saved.html" class="btn btn-primary mt-4">Back to journeys</a></div>`;
      return;
    }

    trip = snap.data();
    const days = Array.isArray(trip.days) ? trip.days : [];
    const updates = {};
    document.title = `${trip.destination} · HiddenTrails.AI`;

    // Hero
    if (!trip.hero_image) {
      const hero = await getDestinationImage(trip.destination);
      if (hero) { trip.hero_image = hero; updates.hero_image = hero; }
    }
    heroImage.src = trip.hero_image || FALLBACK_IMAGE;
    const style = trip.trip_style ?? trip.preference ?? "Custom";
    $("tripTitle").textContent = trip.destination;
    $("budgetInfo").textContent = trip.arrivalDate
      ? `${new Date(trip.arrivalDate + "T00:00").toDateString().slice(4, 10)} → ${new Date(trip.returnDate + "T00:00").toDateString().slice(4, 10)}`
      : `A ${days.length}-day plan`;
    $("heroTags").innerHTML = `
      <span class="tag"><i class="fa-regular fa-calendar"></i>${days.length} days</span>
      <span class="tag"><i class="fa-solid fa-compass"></i>${escapeHtml(style)}</span>
      <span class="tag"><i class="fa-solid fa-wallet"></i>${inr(trip.budget)}</span>`;

    if (days.length === 0) {
      daysContainer.innerHTML = `<div class="empty-state"><div class="emoji">🌫️</div><p class="font-display text-xl">This trip has no days yet.</p><p class="muted">Try regenerating it.</p></div>`;
      $("budgetCard").hidden = false;
      return;
    }

    renderBudget(days);

    // Day images: reuse cached ones, fetch missing in parallel
    let imagesChanged = false;
    const images = await Promise.all(days.map(async (day) => {
      if (day.image) return day.image;
      const landmark = extractLandmark(day);
      const query = landmark
        ? `${landmark} ${trip.destination}`
        : `${trip.destination} ${(day.title || "").replace(/Arrival|Beach|Vibes|&/gi, "").trim() || "landmark"}`;
      const url = await getDestinationImage(query);
      if (url) { day.image = url; imagesChanged = true; }
      return url;
    }));

    daysContainer.innerHTML = "";
    days.forEach((day, i) => daysContainer.appendChild(renderDay(day, images[i])));
    renderDayNav(days);
    revealOnScroll();

    if (imagesChanged) updates.days = days;
    if (Object.keys(updates).length) {
      updateDoc(doc(db, "trips", id), updates).catch((e) => console.warn("Could not cache images:", e.message));
    }

    if (params.get("new") === "1") {
      history.replaceState(null, "", `itinerary.html?id=${encodeURIComponent(id)}`);
      confetti({ count: 90 });
      toast("Your trail is ready. Photo challenges for it were added too!", "success", 5000);
    }
  } catch (err) {
    console.error("LoadTrip Error:", err);
    daysContainer.innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><p class="font-display text-xl">Something went wrong loading this trip.</p></div>`;
  }
}

const user = await requireUser();
shell.setUser(user);
loadTrip();

regenBtn.addEventListener("click", async () => {
  if (!trip) return;
  const ok = await confirmDialog({
    title: "Regenerate this trip?",
    body: "The AI will write a fresh plan and replace the current one.",
    confirmText: "Regenerate",
    icon: "fa-rotate",
  });
  if (!ok) return;

  const restore = busy(regenBtn, "Regenerating…");
  try {
    await api("/regenerate-itinerary", { method: "POST", body: { tripId: id } });
    location.reload();
  } catch (err) {
    console.error("Regenerate error:", err);
    toast(err.status ? err.message : "Couldn't regenerate. Is the backend running?", "error");
    restore();
  }
});
</script>
</body>
</html>
