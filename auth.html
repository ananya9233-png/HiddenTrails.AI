<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · HiddenTrails.AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    .split { display: grid; grid-template-columns: 1.05fr 1fr; min-height: 100vh; }
    .photo-side { position: relative; overflow: hidden; background: var(--ink); color: #fff; }
    .photo-side img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: kenburns 24s ease-in-out infinite alternate; }
    @keyframes kenburns { from { transform: scale(1.05); } to { transform: scale(1.18) translate(-2%, -2%); } }
    .photo-side::after { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(20,28,25,.15) 0%, rgba(20,28,25,.8) 100%); }
    .photo-content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 2.5rem; }
    .postcard { background: rgba(255,253,248,.95); color: var(--ink); border-radius: 16px; padding: 1.25rem 1.4rem; max-width: 360px; transform: rotate(-2deg); box-shadow: var(--shadow-lg); }
    .split > * { min-width: 0; }
    .form-side { display: flex; align-items: center; justify-content: center; padding: 2.5rem 1.25rem; }
    @media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); } .photo-side { display: none; } }
  </style>
</head>

<body>
<div class="split">
  <section class="photo-side" aria-hidden="true">
    <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=80" alt="" />
    <div class="photo-content">
      <a href="index.html" class="brand !p-0"><span class="brand-mark"><i class="fa-solid fa-mountain-sun"></i></span><span class="brand-name" style="color:#fff">HiddenTrails<em>.ai</em></span></a>
      <div class="postcard float">
        <p class="handwritten text-lg leading-snug">“Found a waterfall the map didn't know about. Best detour of my life.”</p>
        <p class="text-xs muted mt-3">— postcard from Meghalaya</p>
      </div>
    </div>
  </section>

  <section class="form-side">
    <div id="authCard" class="w-full max-w-md stagger">
      <a href="index.html" class="brand !p-0 mb-10 lg:hidden"><span class="brand-mark"><i class="fa-solid fa-mountain-sun"></i></span><span class="brand-name">HiddenTrails<em>.ai</em></span></a>
      <span class="eyebrow">Welcome back</span>
      <h1 class="h1 mt-2 mb-2">Pick up the <span class="italic-accent">trail</span>.</h1>
      <p class="ink-2 mb-8">Log in to see your journeys, challenges and points.</p>

      <form id="loginForm" class="space-y-5" novalidate>
        <div>
          <label for="email" class="label">Email</label>
          <div class="input-icon">
            <i class="fa-regular fa-envelope"></i>
            <input id="email" type="email" autocomplete="email" placeholder="you@example.com" class="input" />
          </div>
        </div>

        <div>
          <div class="flex justify-between items-end">
            <label for="password" class="label">Password</label>
            <a href="#" id="forgotPassword" class="text-xs font-semibold mb-2" style="color:var(--clay)">Forgot password?</a>
          </div>
          <div class="input-icon">
            <i class="fa-solid fa-lock"></i>
            <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" class="input !pr-12" />
            <button type="button" id="togglePassword" class="trailing btn btn-ghost btn-icon !w-9 !h-9" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>

        <button id="loginBtn" type="submit" class="btn btn-primary btn-lg btn-block">Log in <i class="fa-solid fa-arrow-right"></i></button>
      </form>

      <p class="text-center ink-2 mt-8 text-sm">
        New here?
        <a href="signup.html" class="font-bold underline underline-offset-4" style="color:var(--moss)">Create an account</a>
      </p>
    </div>
  </section>
</div>

<script type="module">
  import { auth } from "./js/app.js";
  import { toast, busy, stagger } from "./js/ui.js";
  import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    confirmPasswordReset,
  } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

  stagger(document.getElementById("authCard"));
  const $ = (id) => document.getElementById(id);
  const passwordInput = $("password");

  $("togglePassword").addEventListener("click", () => {
    const hidden = passwordInput.type === "password";
    passwordInput.type = hidden ? "text" : "password";
    $("togglePassword").innerHTML = `<i class="fa-regular ${hidden ? "fa-eye-slash" : "fa-eye"}"></i>`;
  });

  // LOGIN
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("email").value.trim();
    const password = passwordInput.value;
    if (!email || !password) { toast("Enter your email and password.", "error"); return; }

    const restore = busy($("loginBtn"), "Logging in…");
    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "dashboard.html";
    } catch (err) {
      console.error(err);
      restore();
      toast("That email and password don't match.", "error");
      $("authCard").animate([{ transform: "translateX(0)" }, { transform: "translateX(-8px)" }, { transform: "translateX(8px)" }, { transform: "translateX(0)" }], { duration: 300 });
    }
  });

  // FORGOT PASSWORD
  $("forgotPassword").addEventListener("click", async (e) => {
    e.preventDefault();
    const email = $("email").value.trim();
    if (!email) { toast("Type your email above first.", "info"); $("email").focus(); return; }
    try {
      await sendPasswordResetEmail(auth, email);
      toast("If that account exists, a reset link is on its way.", "success", 5000);
    } catch (err) {
      toast(err.message, "error");
    }
  });

  // ========== PASSWORD RESET FROM EMAIL LINK ==========
  const urlParams = new URLSearchParams(window.location.search);
  const oobCode = urlParams.get("oobCode");

  if (urlParams.get("mode") === "resetPassword" && oobCode) {
    $("authCard").innerHTML = `
      <span class="eyebrow">Account recovery</span>
      <h1 class="h1 mt-2 mb-2">Set a new <span class="italic-accent">password</span>.</h1>
      <p class="ink-2 mb-8">Choose something you'll remember.</p>
      <form id="resetForm" class="space-y-5">
        <div><label class="label" for="newPassword">New password</label>
          <input id="newPassword" type="password" class="input" placeholder="••••••••" autocomplete="new-password" /></div>
        <div><label class="label" for="confirmPassword">Confirm password</label>
          <input id="confirmPassword" type="password" class="input" placeholder="••••••••" autocomplete="new-password" /></div>
        <button id="resetBtn" class="btn btn-primary btn-lg btn-block">Reset password</button>
      </form>`;

    $("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const newPass = $("newPassword").value;
      const confirmPass = $("confirmPassword").value;
      if (!newPass || !confirmPass) { toast("Fill in both fields.", "error"); return; }
      if (newPass !== confirmPass) { toast("Passwords don't match.", "error"); return; }
      if (newPass.length < 8) { toast("Use at least 8 characters.", "error"); return; }

      const restore = busy($("resetBtn"), "Saving…");
      try {
        await confirmPasswordReset(auth, oobCode, newPass);
        toast("Password reset! Redirecting to login…", "success");
        setTimeout(() => (window.location.href = "auth.html"), 1800);
      } catch (err) {
        restore();
        toast(err.message, "error");
      }
    });
  }
</script>
</body>
</html>
